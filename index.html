<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinstar</title>
<meta name="description" content="Twinstar — steer twin comets through asymmetric gates. Get it on Google Play.">
<meta property="og:title" content="Twinstar">
<meta property="og:description" content="Steer twin comets through asymmetric gates. Get it on Google Play.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060f;
    color: #e8ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 32px 20px; text-align: center;
  }
  h1 {
    font-size: clamp(28px, 8vw, 44px);
    margin: 0 0 8px;
    background: linear-gradient(90deg, #7dd3fc, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tagline { color: #9aa3c7; margin: 0 0 28px; font-size: 15px; max-width: 40ch; }
  .btn {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 14px;
    background: #7dd3fc;
    color: #05060f;
    font-weight: 700;
    text-decoration: none;
    font-size: 16px;
  }
  footer { margin-top: 40px; font-size: 12px; color: #565f8a; }
</style>
</head>
<body>
  <h1>Twinstar</h1>
  <p class="tagline">Steer twin comets through asymmetric gates. Free on Android.</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.twinstar.app">Get it on Google Play</a>
  <footer>&copy; Twinstar</footer>
</body>
</html>
