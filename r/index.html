<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twinstar Online Room</title>
<meta name="description" content="Join a live Twinstar online match. This invite is one-time — first to join wins the seat.">
<meta property="og:title" content="Twinstar Online Room">
<meta property="og:description" content="Join a live Twinstar online match. This invite is one-time — first to join wins the seat.">
<meta property="og:type" content="website">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05060f;
    color: #e8ecff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100%; padding: 32px 20px; text-align: center;
  }
  h1 { font-size: clamp(22px, 6vw, 30px); margin: 0 0 6px; }
  p.sub { color: #9aa3c7; margin: 0 0 20px; font-size: 14px; max-width: 42ch; }
  .live-banner {
    display: inline-flex; align-items: center; gap: 8px;
    background: #201338; border: 1px solid #4c2f7a; color: #d9b8ff;
    border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 700;
    margin-bottom: 20px; letter-spacing: 0.5px;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #a78bfa; }
  .code-box {
    font-family: "SF Mono", "Consolas", monospace;
    font-size: clamp(28px, 10vw, 44px);
    letter-spacing: 4px;
    font-weight: 700;
    background: #10132a;
    border: 1px solid #2a2f56;
    border-radius: 16px;
    padding: 20px 28px;
    margin: 0 0 20px;
    color: #7dd3fc;
    max-width: 90vw;
  }
  .row { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
  button, a.btn {
    font: inherit;
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }
  .primary { background: #7dd3fc; color: #05060f; }
  .secondary { background: #1b1f42; color: #e8ecff; border: 1px solid #2a2f56; }
  .play-link { color: #9aa3c7; font-size: 13px; margin-top: 22px; text-decoration: underline; }
  .hint { font-size: 12px; color: #6b74a0; margin-top: 10px; min-height: 16px; }
  .note { font-size: 12px; color: #6b74a0; margin-top: 4px; max-width: 40ch; }
  .error-state h1 { color: #e8ecff; }
</style>
</head>
<body>
  <div id="app">
    <h1>Loading room&hellip;</h1>
  </div>

  <script>
    (function () {
      var MAX_LEN = 8; // headroom above the 5-char code

      function sanitize(raw) {
        if (typeof raw !== 'string') return '';
        var trimmed = raw.slice(0, MAX_LEN);
        var match = trimmed.match(/^[0-9A-Za-z-]+$/);
        return match ? trimmed : '';
      }

      function getParam(name) {
        try {
          var params = new URLSearchParams(window.location.search);
          return params.get(name);
        } catch (e) {
          return null;
        }
      }

      // isIOS() now decides ONE thing only: which app store (if any) is the
      // right one to advertise. It no longer gates the scheme button — see the
      // OPEN IN TWINSTAR block below for why that gate was removed.
      function isIOS() {
        var ua = navigator.userAgent || '';
        // iPadOS 13+ lies and reports as Macintosh; the touch probe catches it.
        return /iPad|iPhone|iPod/.test(ua) ||
          (/Macintosh/.test(ua) && typeof document.ontouchend !== 'undefined');
      }

      function renderError(root) {
        root.innerHTML = '';
        root.className = 'error-state';
        var h1 = document.createElement('h1');
        h1.textContent = 'This link is incomplete';
        var p = document.createElement('p');
        p.className = 'sub';
        p.textContent = "We couldn't find a room code in this link. Ask your friend to resend it.";
        root.appendChild(h1);
        root.appendChild(p);
        if (!isIOS()) {
          var a = document.createElement('a');
          a.className = 'btn primary';
          a.href = 'https://play.google.com/store/apps/details?id=com.twinstar.app';
          a.textContent = 'Get Twinstar on Google Play';
          root.appendChild(a);
        }
      }

      function renderRoom(root, code) {
        root.innerHTML = '';
        var banner = document.createElement('div');
        banner.className = 'live-banner';
        var dot = document.createElement('span');
        dot.className = 'live-dot';
        banner.appendChild(dot);
        banner.appendChild(document.createTextNode('LIVE · ONE-TIME INVITE'));

        var h1 = document.createElement('h1');
        h1.textContent = "You're invited to a match!";
        var sub = document.createElement('p');
        sub.className = 'sub';
        sub.textContent = 'Copy the room code and paste it into Twinstar to join.';

        var codeBox = document.createElement('div');
        codeBox.className = 'code-box';
        codeBox.textContent = code;

        var row = document.createElement('div');
        row.className = 'row';

        var copyBtn = document.createElement('button');
        copyBtn.className = 'primary';
        copyBtn.type = 'button';
        copyBtn.textContent = 'COPY CODE';

        var hint = document.createElement('div');
        hint.className = 'hint';

        copyBtn.addEventListener('click', function () {
          copyToClipboard(code, function (ok) {
            hint.textContent = ok ? 'Copied!' : 'Could not copy — copy it manually.';
          });
        });

        row.appendChild(copyBtn);

        // The `twinstar://` scheme is registered on BOTH platforms as of
        // 2026-08-02: Android via addons/TwinstarDeepLink's <activity-alias>,
        // iOS via the TwinstarLink plugin's CFBundleURLTypes (see
        // ios/plugins/twinstar_link.gdip; plugins/TwinstarLink=true in both
        // export presets, on TestFlight since build 59).
        //
        // This button used to be hidden on iOS, because an iPhone with no
        // handler answers with a modal "Safari cannot open the page because the
        // address is invalid" — an owner hit that in the wild. That gate went
        // stale the moment the iOS plugin shipped, and it was itself the reason
        // an iPhone recipient had no way into the app at all. Keep this button
        // on iOS even after Universal Links land: this page is still what a
        // recipient sees when the app is not installed, and when a chat client's
        // in-app browser swallows the Universal Link instead of honouring it.
        // It matters more here than on /c/, because a room invite is LIVE — the
        // host is waiting and the copy-and-paste detour costs seconds.
        //
        // Residual risk, accepted and mitigated: an iOS visitor who does NOT
        // have Twinstar installed still sees that modal. COPY CODE stays the
        // primary CTA above this button, and the paste steps stay on screen for
        // iOS below it, so the modal is recoverable instead of a dead end.
        var openBtn = document.createElement('a');
        openBtn.className = 'btn secondary';
        openBtn.href = 'twinstar://r/' + encodeURIComponent(code);
        openBtn.textContent = 'OPEN IN TWINSTAR';
        row.appendChild(openBtn);

        var note = document.createElement('p');
        note.className = 'note';
        note.textContent = 'This invite only works while the host is waiting, and only for the first person who joins. If it fails, ask for a fresh link.';

        root.appendChild(banner);
        root.appendChild(h1);
        root.appendChild(sub);
        root.appendChild(codeBox);
        root.appendChild(row);
        root.appendChild(hint);

        // Kept on iOS as the recovery path for the "address is invalid" modal
        // described above. Android's scheme handler is device-proven, so it
        // stays hidden there — unchanged behaviour on that platform.
        if (isIOS()) {
          var steps = document.createElement('p');
          steps.className = 'note';
          steps.textContent = 'Nothing happened? Copy the code above, then in Twinstar: MODE SELECT → ONLINE → JOIN → PASTE.';
          root.appendChild(steps);
        }

        root.appendChild(note);

        // Play Store only where the Play Store is the right store. On iPhone this
        // used to send people to an Android listing they cannot install from.
        if (!isIOS()) {
          var playLink = document.createElement('a');
          playLink.className = 'play-link';
          playLink.href = 'https://play.google.com/store/apps/details?id=com.twinstar.app';
          playLink.textContent = "Don't have Twinstar? Get it on Google Play";
          root.appendChild(playLink);
        }
      }

      function copyToClipboard(text, cb) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { cb(true); },
            function () { fallbackCopy(text, cb); }
          );
        } else {
          fallbackCopy(text, cb);
        }
      }

      function fallbackCopy(text, cb) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          cb(ok);
        } catch (e) {
          cb(false);
        }
      }

      var root = document.getElementById('app');
      var raw = getParam('k');
      var code = sanitize(raw);
      if (!code) {
        renderError(root);
      } else {
        renderRoom(root, code);
      }
    })();
  </script>
</body>
</html>
